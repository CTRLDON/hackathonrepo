name: smoke-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      # No model is needed: agent calls are stubbed and gates, guardrails, approvals and the
      # mocked sale-to-cash flow are plain Python.
      - run: pytest -q tests/
